<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forms Learning</title>
 </head>
 <!--form action="form-get.html" method="get"-->
<form action="form-post.html" method="post"
    
    <h2>Sample Form</h2>
    <label>Full Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required maxlength="50"><br><br>
    <label for="age">Age:</label><br>
    <input type="number" id="age" name="age" min="0" max="120" step="1" required><br><br>
    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="Male" required>
    <label for="male">Male</label>
    <input type="radio" id="Female" name="gender" value="Male" required>
    <label for="female">Female</label><br><br>

    <label>Hobbies:</label><br>
 <input type="checkbox" id="reading" name="hobbies" value="walking">
  <label for="walking">Walking</label>
    <input type="checkbox" id="swimming" name="hobbies" value="swimming">
    <label for="swimming">Swimming</label>
    <input type="checkbox" id="sports" name="hobbies" value="Sports">
    <label for="sports">Sports</label><br><br>

    <label for="country">Country:</label><br>
    <select id="country" name="country" required>
      <option value="" disabled selected>Select your country</option>
      <option value="usa">United States</option>
      <option value="canada">Canada</option>
      <option value="india">India</option>
    </select><br><br>

    <label for="bio">Short Bio:</label><br>
    <textarea id="bio" name="bio" rows="4" cols="50" maxlength="300" placeholder="Tell us something about yourself..."></textarea><br><br>

    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email" placeholder="example@example.com" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required minlength="6" maxlength="20"><br><br>

    <label for="dob">Date of Birth:</label><br>
    <input type="date" id="dob" name="dob" max="2025-06-09" required><br><br>

     <input type="submit" value="Submit">

 </form>
