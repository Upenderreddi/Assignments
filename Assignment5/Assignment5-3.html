<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Float Breakdown</title>
  <style>
   
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .pricing-container {
      background: #fff;
      padding: 20px;
      border: 1px solid #ccc;
      
    }

    .card {
      float: left;
      width: 30%;
      margin: 2%;
      background: #e0eaff;
      padding: 20px;
      border: 2px solid #007bff;
      border-radius: 8px;
    }

    .card h2 {
      margin-top: 0;
    }

    .price {
      font-size: 1.8em;
      margin: 10px 0;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin: 10px 0;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 1em;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Float-Based Pricing Cards (Break It!)</h1>
  <div class="pricing-container">
    <div class="card">
      <h2>Basic</h2>
      <p class="price">$9</p>
      <ul>
        <li>✅ 1 Project</li>
        <li>📦 5GB Storage</li>
        <li>📧 Email Support</li>
      </ul>
      <button>Subscribe</button>
    </div>

    <div class="card">
      <h2>Pro</h2>
      <p class="price">$29</p>
      <ul>
        <li>🚀 10 Projects</li>
        <li>📦 50GB Storage</li>
        <li>📞 Priority Support</li>
      </ul>
      <button>Subscribe</button>
    </div>

    <div class="card">
      <h2>Enterprise</h2>
      <p class="price">$99</p>
      <ul>
        <li>🏢 Unlimited Projects</li>
        <li>💾 1TB Storage</li>
        <li>📞 24/7 Support</li>
      </ul>
      <button>Subscribe</button>
    </div>
  </div>
</body>
</html>
